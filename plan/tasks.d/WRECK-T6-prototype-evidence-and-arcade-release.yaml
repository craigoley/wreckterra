  rationale: "The operator authorized a mobile-first original-IP real-location combat game built by Remudero through Console. Existing repo ID 1432832754 must be adopted. This initial plan is held until the actual runner/App/bootstrap gates are verified; release only the accepted frontier, preserving existing jobs and budgets. Clarified against the approved product brief (product-plan pplan-936136b66a775defaf206ec2). Settled by lookup: is device evidence already filed? -> yes, here in WRECK-T6; no new task (plan/tasks.d). Settled by lookup: which device comes first and how are Android receipts kept? -> the operator's iPhone is the first actual device check; Android emulation and physical Android evidence are recorded as separate receipts (brief decisions/2). Settled by lookup: does browser emulation count as device performance or playthrough evidence? -> no, real device/browser performance and a physical iPhone playthrough are recorded separately from emulation (brief decisions/8). Settled by lookup: does a missing physical Android device block the iPhone receipt? -> no, it stays an explicit unverified receipt requested as concrete operator input (this task's design, AGENTS.md)."
  design: "Create reproducible held-out geography/bot/replay/performance checks with source/build/seed/device/network identity and positive failure controls. Bind existing authorized Vercel project via product flow and verify exact deployment SHA and public complete-match route. Preserve local/hosted/review/merge/deploy/playability receipt boundaries; no browser fixture as physical-device proof. Device evidence uses distinct receipt kinds that never satisfy one another: browser-emulation (desktop phone viewport or Android emulator), physical-iphone-safari, and physical-android-chrome. The operator's iPhone is the first actual device check: record a physical iPhone Safari playthrough (training plus a complete skirmish, including a background/resume and a rotation) and its measured performance against the exact deployed SHA. Android emulation evidence is recorded separately from physical Android evidence; until a physical Android device is available its receipt stays explicitly unverified. Measure load, warm p95 frame time, bounded memory populations and input interruptions on actual iPhone/Safari/Android/Chrome when available; request only concrete remaining operator device input. Keep Vercel same setup/caps; no domain purchase. Add actual verified game to cao825/oley-arcade through its own reviewed PR, not an out-of-root edit. Feed observed defects as bounded improvement proposals; no auto objective/gate/budget changes or production promotion.\nNO-INVARIANTS: no release, deployment or device evidence exists yet for this product, so there is no prior behavior to keep."
