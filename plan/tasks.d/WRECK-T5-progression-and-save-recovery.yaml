      proof: "unit test: WRECK-T5: replaying a match result rewards mastery only once"
    - claim: corrupt or denied local storage recovers without pretending progress saved
      proof: "unit test: WRECK-T5: corrupt or denied local storage recovers without pretending progress saved"
    - claim: vehicle unlocks preserve sidegrade budgets and geographic access
      proof: "unit test: WRECK-T5: vehicle unlocks preserve sidegrade budgets and geographic access"
  falsifier: Remove the corresponding input, identity, invariant, source validation or evidence guard independently. Its discriminating unit/browser proof must fail and pass on restoration. Confirm actual nonzero test counts; pin artifacts and compare the same units. Physical-device and live deployment receipts remain separate from fixtures.
