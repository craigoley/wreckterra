  rationale: "Operator feedback 2026-11-24 on the first build (WRECK-T1): \"In no way does what this is resemble\" the vehicular-combat game intended; \"It's an mvp, it just didn't match my intent\". The plan put combat in WRECK-T4 after controls and the map, so the first playable build had nothing to fight. Operator 03:52Z: go with the recommendation to re-plan around a combat slice first in a simple original arena."
  design: |
    Build the first playable slice of the core experience: one short vehicular-combat match in a small original arena, on top of WRECK-T1's fixed-tick simulation. Original identity only: our own vehicles, names and arena, inspired by broad vehicular-combat roles, copying no existing game's characters, art, levels or text.
    The slice has: an enclosed original arena (a walled lot with ramps, cover blocks and two pickup pads); three original vehicles with distinct roles (light and fast, balanced, heavy and tough) each with health; a forward machine gun, a lock-on missile with limited ammo, and one special per vehicle; health and ammo pickups that respawn; four bots that chase, strafe, fire, take cover and grab pickups; damage feedback (hit flashes, sparks, smoke at low health, an explosion and wreck on death); a match timer of at most 5 minutes; a win when the player is the last car running and a lose when the player is wrecked; and a restart button. Desktop keyboard and basic on-screen touch controls both drive and fire. Combat rules live in the simulation (deterministic, seeded) so the bots and outcomes are testable. The app starts every match through createCombatMatch( from src/sim/combat.ts, called in src/App.tsx.
    The feel bar for this and every later build is plan/feel-checklist.md: the build states in its PR how it meets each line.
    NO-INVARIANTS: only WRECK-T1's driving foundation exists; no prior combat behavior has to be kept.

