  note: "Hold released 2026-11-03 on the operator's direction to adopt Wreckterra as a fleet repo. Readiness checked at core f15de9f: the owned web test profile is registered (src/lib/review.ts, owner craigoley, repo wreckterra, vitest roots tests/), and the native one-job path for a daemonless managed target is merged (W1-T10799, #15041). WRECK-T2..T6 stay held behind this frontier."
  rationale: The operator authorized a mobile-first original-IP real-location combat game built by Remudero through Console. Existing repo ID 1432832754 must be adopted. This initial plan is held until the actual runner/App/bootstrap gates are verified; release only the accepted frontier, preserving existing jobs and budgets.
  design: |
    Extend the qualified React/Vite/TypeScript starter with a small Three/Rapier driving foundation for Wreckterra under existing Vercel deployment conventions. Keep fixed-tick seeded simulation, versioned input/events/snapshots and local-authority interface independent of rendering and React. Start with original placeholder geometry. Reuse the existing real test/typecheck/build/quality commands and pinned .github/workflows/ci.yml, whose always-reporting ci-gate job already gates typecheck, coverage, build and security. Do not edit or create workflow files in this task. Add meaningful simulation tests to the existing Vitest unit root; preserve measured quality floors, security checks and branch protection, never invent a measured floor. Include tests/unit and later browser roots in the exact registered Wreckterra profile. No unbounded install/build loop, new paid provider or server simulation. No copyrighted franchise assets. Provide an accessible non-WebGL/error state and a visible playable initial driving surface, not only a menu. The merged starter PR2 is onboarding preparation, not gameplay credit. Trusted gameplay dispatch waits for actual target runner acceptance and the Console product C4 admission flow. Core W1-T10614 and product C4 evidence are upstream readiness requirements, not foreign dependency IDs. The production call-site proof pins createWorld in src/App.tsx; implement that actual runtime integration, never a comment or unused wrapper.
    NO-INVARIANTS: the repository has only the starter garage and no playable driving, so no prior player-visible behavior has to be kept.

