  rationale: The operator authorized a mobile-first original-IP real-location combat game built by Remudero through Console. Existing repo ID 1432832754 must be adopted. This initial plan is held until the actual runner/App/bootstrap gates are verified; release only the accepted frontier, preserving existing jobs and budgets.
  design: Create a small React/Vite/TypeScript/Three/Rapier foundation for Wreckterra under existing Vercel deployment conventions. Keep fixed-tick seeded simulation, versioned input/events/snapshots and local-authority interface independent of rendering and React. Start with original placeholder geometry. Install real test/typecheck/build/quality commands and pinned CI actions, always-reporting ci-gate and security checks; measure nonzero quality baselines from meaningful tests before applying inherited protection, never invent a measured floor. Include tests/unit and later browser roots in the exact registered Wreckterra profile. No unbounded install/build loop, new paid provider or server simulation. No copyrighted franchise assets. Provide an accessible non-WebGL/error state and a visible playable initial driving surface, not only a menu. Bootstrap is onboarding preparation; trusted gameplay dispatch waits for actual target runner acceptance. Core W1-T10614 and product C4 evidence are upstream readiness requirements, not foreign dependency IDs. The production call-site proof pins createWorld in src/App.tsx; implement that actual runtime integration, never a comment or unused wrapper.
  acceptance:
    - claim: the simulation advances fixed ticks independently of React
      proof: "unit test: WRECK-T1: the simulation advances fixed ticks independently of React"
    - claim: foundation commands run real tests and reject a seeded failure
      proof: "unit test: WRECK-T1: foundation commands run real tests and reject a seeded failure"
    - claim: mount and unmount leave exactly one simulation loop
      proof: "unit test: WRECK-T1: mount and unmount leave exactly one simulation loop"
