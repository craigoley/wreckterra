  rationale: The operator authorized a mobile-first original-IP real-location combat game built by Remudero through Console. Existing repo ID 1432832754 must be adopted. This initial plan is held until the actual runner/App/bootstrap gates are verified; release only the accepted frontier, preserving existing jobs and budgets.
  design: Acquire a bounded reproducible Central Park sector with an audited source snapshot/URL/date/hash and ODbL provenance. Developer-time limited extraction only; public Overpass/Nominatim/tiles are not a production consumer backend. No autocomplete. Keep real path, water and landmark relationships; use local metric physics coordinates with a stable origin. Generate separate simple scenery, collision and vehicle navigation plus clear dry spawns. Label inferred heights and authored widened paths/ramps/cover separately; no fake geographic fidelity. Handle polygon holes, layer/bridge/tunnel ordering, nonfinite data and edge buffers. Pin immutable compiler/rules/physics/overlay/source versions and artifact hashes. Include visible OSM attribution and applicable source/data offer; independently sourced landmark art only. Compare a tiny bad fixture/control to prove water/false-crossing/disconnected-route failures are detected. The production call-site proof pins loadArena in src/game/VehicleScene.tsx; implement that actual runtime integration, never a comment or unused wrapper. Normalize raw OSM identities by type and ID before GeoJSON conversion or topology generation, preserving agreeing geometry and nonconflicting metadata independently of duplicate order; repeated normalization is idempotent. The existing Bethesda snapshot SHA256 8c2d3a28b2a4e34e1510a71bc8757776d1603ab74c44910097088575b620d1df has 4718 raw node elements and 434 raw way elements but 4717 unique nodes and 433 unique ways. Way 958635828 (Bethesda Fountain) and node 2216963836 (Bow Bridge Boat Landing) each occur once with tags and again without tags, with agreeing shared fields. Retain each landmark exactly once and retain its tags; last-value-wins must not erase the identity. Reject conflicting geometry or tag values as unavailable source input for explicit repair, rather than choosing silently. Keep raw snapshot bytes and their pin unchanged and report raw element counts separately from unique typed identities. This is a known source-derived regression case, not an unseen holdout.
  acceptance:
    - claim: Central Park preserves pinned geographic identity and source attribution
      proof: "unit test: WRECK-T3: Central Park preserves pinned geographic identity and source attribution"
    - claim: water spawns false crossings and disconnected objectives are rejected
