  falsifier: Remove the corresponding input, identity, invariant, source validation or evidence guard independently. Its discriminating unit/browser proof must fail and pass on restoration. Confirm actual nonzero test counts; pin artifacts and compare the same units. Physical-device and live deployment receipts remain separate from fixtures. A tagged-then-bare Bethesda Fountain duplicate and its reversed order must retain the same named landmark once; replacing normalization with last-value-wins must fail this known regression. Conflicting geometry and conflicting tag values must each refuse compilation, with independent negative controls.
