  rationale: "Operator 2026-11-24T12:36Z on the live WRECK-T10 arena: it \"still looks nothing like\" the intended game; the point is to \"drive a car around with weapons and fight other cars in real cities with realistic visuals of the city\". The flat arena is replaced by a real-city slice."
  design: |
    Replace the flat top-down arena with a real city in 3D. The scene is a bounded district of real Manhattan streets on the south edge of Central Park (about Central Park South to West 57th Street, Sixth Avenue to Fifth Avenue, with Grand Army Plaza and the park edge), compiled at developer time from a pinned OpenStreetMap snapshot (Overpass extract saved in the repo with its URL, date and SHA-256; no live Overpass, Nominatim or tile calls in production). Original identity only: our own cars, names and art; nothing copied from an existing game.
    1. scripts/acquire-midtown.mjs saves the snapshot; src/maps/city-compiler.ts turns it into public/maps/midtown/city.json: building footprints extruded to a height from height, then building:levels times 3.2 m, then a labelled default; road ribbons with widths from highway class and lanes; sidewalks; the park edge as grass with trees; local metric coordinates from a stable origin; a drivable street graph; and clear spawn points on roads. The compiler is deterministic (same snapshot, same bytes out) and rejects non-finite or self-intersecting geometry.
    2. Rendering uses three.js through @react-three/fiber. src/game/CityScene.tsx draws the extruded buildings with procedural facade materials (window grids, ground-floor storefront bands, roof caps, varied by building id), asphalt with lane markings, curbs and sidewalks, street lights and trees, sky and fog, and soft shadows, merged into few draw calls. src/game/ChaseCamera.tsx follows the player car from behind and above with smoothing. Visual quality adapts to measured frame time (resolution scale and shadow quality) without touching the simulation.
    3. The player drives one original combat car (a 3D model built from primitives in our own style) on WRECK-T1's fixed-tick simulation, at arcade speed, with collisions against building footprints and curbs. Keyboard, gamepad and the existing touch controls drive it. The app loads the city through loadCity( from src/maps/midtown.ts, called in src/game/VehicleScene.tsx.
    4. The page shows visible OSM attribution (ODbL) and NOTICE.txt carries the source and licence.
    The feel bar is plan/feel-checklist.md; the PR states how it meets lines 2, 7 and 8 and says why the combat lines wait for WRECK-T12.
    NO-INVARIANTS: the WRECK-T10 arena is replaced, so no prior map or camera behavior has to be kept; WRECK-T10's combat simulation stays for WRECK-T12.

