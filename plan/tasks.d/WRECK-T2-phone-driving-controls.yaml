  rationale: "The operator authorized a mobile-first original-IP real-location combat game built by Remudero through Console. Existing repo ID 1432832754 must be adopted. This initial plan is held until the actual runner/App/bootstrap gates are verified; release only the accepted frontier, preserving existing jobs and budgets. Clarified against the approved product brief decision 'Mobile resilience and measured quality' (product-plan pplan-936136b66a775defaf206ec2). Settled by lookup: is page-lifecycle, WebGL recovery or adaptive quality already filed elsewhere? -> no; WRECK-T2 already owns lifecycle.ts, context-loss tests and adaptive resolution, WRECK-T1 owns only the non-WebGL error state, WRECK-T5 only saves on renderer loss, and the repo has no MASTER-PLAN/DECISIONS/LEARNINGS overriding it (plan/tasks.d, AGENTS.md). Settled by lookup: what did 'Solo hides pause/save' mean? -> hidden-page pause of simulation and audio with explicit tap resume and no catch-up burst (brief decisions/8). Settled by lookup: may adaptive quality change physics? -> no, simulation stays fixed-tick and independent of rendering (brief decisions/8, AGENTS.md). Settled by lookup: does emulation count as device evidence? -> no, physical iPhone, physical Android and Android emulation are separate receipts owned by WRECK-T6 (brief decisions/2 and decisions/8). Settled by lookup: is online reconnect in scope? -> no, later multiplayer work (brief decisions/8, plan/roadmap.md WRECK-T9)."
  design: "Implement third-person arcade driving with mobile priority: left thumb steering/throttle, assisted accelerator option, large Fire/Special/Boost controls, chase camera, reverse/brake/ram/boost and stuck recovery. Keyboard/gamepad adapters share the same versioned input boundary. Pointer capture tracks contacts independently. Held controls: pointercancel, lostpointercapture, window blur, visibility loss and every layout change (orientation change, resize, visualViewport resize, control reflow) release every held command in the same tick, so no input stays latched. Solo page lifecycle: when the page becomes hidden (visibilitychange to hidden or pagehide) pause the fixed-tick simulation and suspend audio; no ticks advance while hidden. On return show an explicit tap-to-resume control instead of auto-resuming; resuming resets the tick accumulator and clock baseline so elapsed hidden time never produces a catch-up burst (the first resumed frame advances at most one fixed tick). Audio starts or resumes only from a user gesture. Renderer recovery: on webglcontextlost call preventDefault and pause the simulation; on webglcontextrestored rebuild GPU resources through the supported R3F/Three renderer path and continue rendering from the same versioned match/world snapshot, never a reset or a second world. If WebGL is unavailable or restore does not arrive within a bounded named timeout, show an accessible recoverable fallback with a retry action while the match state is preserved. Render quality: bound render resolution with a capped device pixel ratio, and step resolution/LOD down or up only from a sustained window of measured frame times with hysteresis, never from a single spike. Quality changes never alter tick rate, physics parameters, collision bodies or threat visibility. Portrait UI and landscape combat reflow without requiring fullscreen/orientation lock. Bounded bodies/effects preserve collision/threat gameplay. Unit and phone viewport browser tests cover inputs/reload/context loss; these are emulation and never device evidence. Real device/browser performance and the physical iPhone playthrough are recorded separately under WRECK-T6. A candidate 30FPS phone floor/60 stronger device target is unmeasured until the benchmark. Do not claim thermals from emulation. Online authority and reconnect remain later multiplayer work. The production call-site proofs pin bindDrivingInput and bindPageLifecycle in src/game/VehicleScene.tsx; implement that actual runtime integration, never a comment or unused wrapper.\nNO-INVARIANTS: there is no playable driving yet; the starter garage is preparation only and WRECK-T1 owns it, so no prior player-visible behavior has to be kept."
