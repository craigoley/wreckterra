  rationale: The operator authorized a mobile-first original-IP real-location combat game built by Remudero through Console. Existing repo ID 1432832754 must be adopted. This initial plan is held until the actual runner/App/bootstrap gates are verified; release only the accepted frontier, preserving existing jobs and budgets.
  design: "Implement third-person arcade driving with mobile priority: left thumb steering/throttle, assisted accelerator option, large Fire/Special/Boost controls, chase camera, reverse/brake/ram/boost and stuck recovery. Keyboard/gamepad adapters share the same versioned input boundary. Pointer capture tracks contacts independently; cancellation, blur, rotation and visibility loss clear commands. Solo hides pause/save; audio starts only after user gesture. Portrait UI and landscape combat reflow without requiring fullscreen/orientation lock. Adaptive resolution/LOD and bounded bodies/effects preserve collision/threat gameplay. Unit and phone viewport browser tests cover inputs/reload/context loss; physical iOS/Android sustained-play evidence remains separate. A candidate 30FPS phone floor/60 stronger device target is unmeasured until the benchmark. Do not claim thermals from emulation. The production call-site proof pins bindDrivingInput in src/game/VehicleScene.tsx; implement that actual runtime integration, never a comment or unused wrapper."
  acceptance:
    - claim: pointer cancellation and backgrounding release every held control
      proof: "unit test: WRECK-T2: pointer cancellation and backgrounding release every held control"
    - claim: touch keyboard and gamepad feed the same simulation contract
      proof: "unit test: WRECK-T2: touch keyboard and gamepad feed the same simulation contract"
    - claim: phone layout keeps driving controls reachable without hover
