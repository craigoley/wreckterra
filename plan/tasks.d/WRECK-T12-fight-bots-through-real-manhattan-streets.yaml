  rationale: "Operator 2026-11-24T12:36Z on the live WRECK-T10 arena: it \"still looks nothing like\" the intended game; the point is to \"drive a car around with weapons and fight other cars in real cities with realistic visuals of the city\". The flat arena is replaced by a real-city slice."
  design: |
    Move WRECK-T10's combat into WRECK-T11's real city and remove the flat arena. Original identity only: our own cars, drivers, names, weapons and art; nothing copied from an existing game.
    1. A match spawns the player and four bots on road spawns of the compiled city. Three original cars (light and fast, balanced, heavy and tough) each have a forward machine gun, a lock-on missile with limited ammo and one special, all built in 3D in our own style.
    2. Bots route on the city's street graph: they hunt the player around blocks, cut through intersections, use buildings as cover (no shots through a building footprint), grab pickups and retreat when low.
    3. Health, ammo and special pickups sit at real places in the district (plaza, intersections) and respawn.
    4. src/game/CombatEffects.tsx shows muzzle flashes, tracers, missile trails, sparks, hit flashes, smoke at low health, explosions and burning wrecks, with camera shake on hits; the HUD shows health, ammo, the lock and bots left.
    5. The match lasts at most 5 minutes; the player wins as the last car running and loses when wrecked; restart is one tap.
    6. src/game/ArenaScene.tsx and src/sim/arena.ts are removed; the app no longer has a flat arena. Combat rules stay in the deterministic seeded simulation. The city match starts through createCityMatch( from src/sim/combat.ts, called in src/App.tsx.
    The feel bar is plan/feel-checklist.md; the PR states how it meets each line.
    INVARIANT combat-rules-kept: weapons, ammo, pickups, the five-minute limit and the win and loss rules behave as in WRECK-T10; only the place and the look change.

